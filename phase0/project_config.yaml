# project_config.yaml

project:
  name: "FORENXAI"
  # Switch this between "Track_A_Single_Corpus" and "Track_B_Pooled_Corpus"
  pipeline_mode: "Track_B_Pooled_Corpus" 

datasets:
  track_a_primary: "TII-SSRC-23"
  track_b_pooled: ["TII-SSRC-23", "CIC-IDS2018"]
  zero_shot_holdout: "CTU-13" # Strictly reserved for Phase 8

directories:
  raw_data: "./data/raw"
  processed_data: "./data/processed"
  models: "./artifacts/models"
  audit_logs: "./artifacts/audit_logs"

features:
  target_column: "Label"
  retain_columns: ["Attack", "dataset_origin"] # Retaining origin to track provenance in the pool
  drop_leakage: ["Flow ID", "Source IP", "Destination IP", "Timestamp"]

metrics:
  primary: "pr_auc"
  calibration: "ece"
  max_allowable_fpr: 0.001 

data_splitting:
  train_split: 0.60
  dev_split: 0.15 
  calibration_split: 0.10 
  holdout_split: 0.15 
  random_seed: 42 

modeling:
  algorithms: ["Logistic Regression", "CART Decision Tree", "Extra Trees", "LightGBM", "CatBoost"]
  explainability: "tree_shap"
  hpo_framework: "optuna"
  optuna_trials: 50
